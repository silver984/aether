name: Build AetherEngine

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cmake_preset }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            cmake_preset: aether-debug

          - os: Windows
            runner: windows-latest
            cmake_preset: aether-debug-verbose

          - os: Windows
            runner: windows-latest
            cmake_preset: aether-release
            artifact_name: windows

          - os: Linux
            runner: ubuntu-latest
            cmake_preset: aether-debug

          - os: Linux
            runner: ubuntu-latest
            cmake_preset: aether-debug-verbose

          - os: Linux
            runner: ubuntu-latest
            cmake_preset: aether-release
            artifact_name: linux-ubuntu

          - os: macOS
            runner: macos-latest
            cmake_preset: aether-debug

          - os: macOS
            runner: macos-latest
            cmake_preset: aether-debug-verbose

          - os: macOS
            runner: macos-latest
            cmake_preset: aether-release
            artifact_name: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "
          import re
          with open('cmake/version.cmake', 'r') as f:
              content = f.read()
              major = re.search(r'set\(AETHER_VERSION_MAJOR\s+(\d+)', content).group(1)
              minor = re.search(r'set\(AETHER_VERSION_MINOR\s+(\d+)', content).group(1)
              patch = re.search(r'set\(AETHER_VERSION_PATCH\s+(\d+)', content).group(1)
              print(f'{major}.{minor}.{patch}')
          ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
      - name: Extract git hash
        id: git
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: cmake --preset ${{ matrix.cmake_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.cmake_preset }}
        
      - name: Upload artifact
        if: contains(matrix.cmake_preset, 'release')
        uses: actions/upload-artifact@v4
        with:
          name: aether${{ steps.git.outputs.short_sha }}-${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}
          path: build/${{ matrix.cmake_preset }}/bin